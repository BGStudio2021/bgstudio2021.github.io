<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>平滑打开动画</title>
    <style>
        :root {
            --easeInQuint: cubic-bezier(0.755, 0.050, 0.855, 0.060);
            --easeInExpo: cubic-bezier(0.950, 0.050, 0.795, 0.035);
            --easeInCirc: cubic-bezier(0.600, 0.040, 0.980, 0.335);
            --easeInBack: cubic-bezier(0.600, -0.280, 0.735, 0.045);
            --easeOutQuint: cubic-bezier(0.230, 1.000, 0.320, 1.000);
            --easeOutExpo: cubic-bezier(0.190, 1.000, 0.220, 1.000);
            --easeOutCirc: cubic-bezier(0.075, 0.820, 0.165, 1.000);
            --easeOutBack: cubic-bezier(0.175, 0.885, 0.320, 1.275);
            --easeInOutQuint: cubic-bezier(0.860, 0.000, 0.070, 1.000);
            --easeInOutExpo: cubic-bezier(1.000, 0.000, 0.000, 1.000);
            --easeInOutCirc: cubic-bezier(0.785, 0.135, 0.150, 0.860);
            --easeInOutBack: cubic-bezier(0.680, -0.550, 0.265, 1.550);
        }

        .img-container {
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            transition: 0.5s;
            opacity: 0;
            pointer-events: none;
        }

        .img-container-open {
            opacity: 1;
            pointer-events: all;
        }

        .img {
            position: fixed;
            z-index: 101;
            width: auto !important;
            border-radius: 8px;
            transition: 0.5s;
        }

        .img-open {
            height: 90% !important;
            top: 5% !important;
            left: 50% !important;
            transform: translateX(-50%);
        }
    </style>
</head>

<body>
    <button id="btn" style="padding: 8px 16px;margin: 8px;" onclick="scale()">查看必应壁纸</button>
    <div class="img-container" id="img-container" onclick="exit()">
        <img src="img1.jpg" class="img" id="img">
    </div>
</body>
<script>
    const btn = document.getElementById('btn');
    const imgContainer = document.getElementById('img-container')
    const img = document.getElementById('img');
    function scale() {
        const bcr = btn.getBoundingClientRect();
        imgContainer.classList.add('img-container-open');
        img.style.left = bcr.left + 'px';
        img.style.top = bcr.top + 'px';
        img.style.width = bcr.width + 'px';
        img.style.height = bcr.height + 'px';
        setTimeout(() => {
            img.classList.add('img-open');
        });
    }
    function exit() {
        imgContainer.classList.remove('img-container-open');
        img.classList.remove('img-open');
    }
</script>

</html>

<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="./favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾音栈</title>
  <style>
    html,
    body {
      background: var(--indigo-primary-dynamic);
    }

    .splash {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: var(--indigo-background);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      transition: 0.3s var(--easeOutCirc);
    }

    .splash-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 128px;
      height: 128px;
    }

    .splash-title {
      width: 200px;
      margin: 16px 0 32px 0;
      filter: invert(1);
      opacity: 0.8;
    }

    .splash-loading-bar {
      position: relative;
      width: 256px;
      height: 8px;
      background: rgba(0, 0, 0, 0.25);
    }

    .splash-loading-bar::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      width: 64px;
      height: 8px;
      background: var(--indigo-text);
      animation: slide 1s alternate-reverse infinite linear;
    }

    @keyframes slide {
      from {
        left: calc(256px - 64px);
      }

      to {
        left: 0;
      }
    }

    .splash-mark {
      position: absolute;
      text-align: center;
      bottom: 16px;
      opacity: 0.8;
    }

    @media screen and (max-width:720px) {
      .splash-mark {
        font-size: 15px;
      }
    }

    /* 深色主题 */

    .body-theme-dark .splash-title {
      filter: none;
    }

    .body-theme-dark .splash-loading-bar {
      background: rgba(255, 255, 255, 0.25);
    }

    @media(prefers-color-scheme: dark) {
      .body-theme-system .splash-title {
        filter: none;
      }

      .body-theme-system .splash-loading-bar {
        background: rgba(255, 255, 255, 0.25);
      }
    }
  </style>
  <script type="module" crossorigin src="./assets/index--0PDJ2uQ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-mxYSY7n-.css">
</head>

<body>
  <!-- 启动页 -->
  <div class="splash">
    <img src="./favicon.ico" alt="RhythmInn-Logo" class="splash-logo">
    <img src="./RhythmInn-Title.png" alt="RhythmInn-Title" class="splash-title">
    <div class="splash-loading-bar"></div>
    <div class="splash-mark">Designed by Burger Studio.</div>
  </div>
  <!-- 启动页 -->
  <div id="app"></div>
  <script>
    // 获取主题设置
    if (localStorage.settings) {
      const theme = JSON.parse(localStorage.settings).theme
      if (theme === 'system') {
        document.body.classList.add('body-theme-system')
      } else if (theme === 'dark') {
        document.body.classList.add('body-theme-dark')
      }
    } else {
      document.body.classList.add('body-theme-system')
    }

    window.addEventListener('load', () => {
      // 加载完成后自动隐藏启动画面
      document.querySelector('.splash').classList.add('splash-hidden')
    })
  </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抖动小球网格</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        .ball {
            position: absolute;
            transform: translate(-50%, -50%) scale(5);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #fff;
        }
    </style>
</head>

<body>
    <script>
        window.onload = function () {
            for (var i = 0; i < 32; i++) {
                for (var j = 0; j < 20; j++) {
                    var ball = document.createElement("div");
                    ball.className = "ball";
                    ball.style.left = i * 45 + 22.5 + "px";
                    ball.style.top = j * 45 + 22.5 + "px";
                    document.body.appendChild(ball);
                }
            }
            window.setInterval(shake, 10);
        }
        window.addEventListener("mousemove", function (event) {
            document.querySelectorAll(".ball").forEach(function (item) {
                var d = Math.sqrt((event.clientX - item.offsetLeft) ** 2 + (event.clientY - item.offsetTop) ** 2);
                // 距离越近，球越大
                // item.style.transform = "translate(-50%,-50%) scale(" + 500 / (d + 50) + ")";
                // 同心圆
                // item.style.transform = "translate(-50%,-50%) scale(" + Math.sin(d / 100 * Math.PI / 2) * 5 + ")";
                // 距离越近，球越亮
                item.style.opacity = 50 / (d);
            });
        });
        function shake() {
            document.querySelectorAll(".ball").forEach(function (item) {
                item.style.transform = "translate(-" + String((Math.random() - 0.5) * 150 + 50) + "%,-" + String((Math.random() - 0.5) * 150 + 50) + "%) scale(5)";
            });
        }
        window.addEventListener("mousedown", function (event) {
            // 小球亮度范围逐渐扩大，形成涟漪效果
            document.querySelectorAll(".ball").forEach(function (item) {
                var d = Math.sqrt((event.clientX - item.offsetLeft) ** 2 + (event.clientY - item.offsetTop) ** 2);
                var n = 0;
                var interval = setInterval(function () {
                    n += 10;
                    item.style.opacity = (50 + n*2) / d;
                    if (n == 100) {
                        clearInterval(interval);
                    }
                }, 10);
            });
        });
        window.addEventListener("mouseup", function (event) {
            // 小球亮度范围逐渐扩大，形成涟漪效果
            document.querySelectorAll(".ball").forEach(function (item) {
                var d = Math.sqrt((event.clientX - item.offsetLeft) ** 2 + (event.clientY - item.offsetTop) ** 2);
                var n = 0;
                window.setTimeout(function () {
                var interval = setInterval(function () {
                    n += 10;
                    item.style.opacity = (250 - n*2) / d;
                    if (n == 100) {
                        clearInterval(interval);
                    }
                }, 10);
                }, 100);
            });
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小磁针-emoji</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        .ball {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0);
        }
        .ball::after {
            content: "👉";
            position: absolute;
            top: 0;
            left: 0;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <script>
        window.onload = function () {
            for (var i = 0; i < 32; i++) {
                for (var j = 0; j < 20; j++) {
                    var ball = document.createElement("div");
                    ball.className = "ball";
                    ball.style.left = i * 45 + 22.5 + "px";
                    ball.style.top = j * 45 + 22.5 + "px";
                    document.body.appendChild(ball);
                }
            }
            // window.setInterval(shake, 10);
        }
        window.addEventListener("mousedown", function (event) {
            document.querySelectorAll(".ball").forEach(function (item) {
                var d = Math.sqrt((event.clientX - item.offsetLeft) ** 2 + (event.clientY - item.offsetTop) ** 2);
                var dx = event.clientX - item.offsetLeft;
                var dy = event.clientY - item.offsetTop;
                var angle = Math.atan2(dy, dx) / Math.PI * 180;
                // 距离越近，球越大
                // item.style.transform = "translate(-50%,-50%) scale(" + 500 / (d + 50) + ")";
                // 同心圆
                // item.style.transform = "translate(-50%,-50%) scale(" + Math.sin(d / 100 * Math.PI / 2) * 5 + ")";
                // 距离越近，球越亮
                item.style.opacity = 250 / (d)
                // 指向鼠标
                // item.style.transform = "translate(-50%,-50%) rotate(" + angle + "deg) scale(5, 1)";
                // item.style.transform = "translate(-50%,-50%) rotate(" + angle + "deg) scale(" + 500 / (d + 50) + ", 1)";
                // item.style.transform = "translate(-50%,-50%) rotate(" + angle + "deg) scale(" + 500 / (d + 50) + ", 5)";
                item.style.transform = "translate(-50%,-50%) rotate(" + angle + "deg)";
            });
        });
        function shake() {
            document.querySelectorAll(".ball").forEach(function (item) {
                item.style.transform = "translate(-" + String((Math.random() - 0.5) * 150 + 50) + "%,-" + String((Math.random() - 0.5) * 150 + 50) + "%) scale(5)";
            });
        }

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>光标小球</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
        }

        .ball {
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            transition-property: left, top, transform;
            transition-duration: 0.01s, 0.01s, 0.1s;
        }
    </style>
</head>
<div class="ball"></div>

<body>
    <script>
        var ball = document.querySelector('.ball');
        var lastPos = { x: 0, y: 0 };
        window.addEventListener('mousemove', function (event) {
            var x = event.clientX;
            var y = event.clientY;
            ball.style.left = x + 'px';
            ball.style.top = y + 'px';
            var d = Math.sqrt((x - lastPos.x) * (x - lastPos.x) + (y - lastPos.y) * (y - lastPos.y));
            ball.style.transform = "translate(-50%,-50%) scale(" + d / 25 + ")";
            lastPos = { x: x, y: y };
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" id="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <style>
        :root {
            --easeOutCirc: cubic-bezier(0.075, 0.820, 0.165, 1.000);
        }

        html,
        body {
            background: #333;
            font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "微软雅黑", sans-serif;
        }

        body {
            transition: 0.5s var(--easeOutCirc);
            opacity: 0;
        }

        .title {
            color: #fff;
            text-align: center;
            font-size: 24px;
            margin-top: 32px;
        }

        .divider {
            margin: 32px 0;
            width: 80%;
            max-width: 768px;
            height: 2px;
            background: #ccc;
            transition: 0.5s var(--easeOutCirc) 0.1s;
            transform: scale(0, 1);
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            padding: 16px;
            width: 80%;
            max-width: 512px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn:hover {
            outline: 2px solid #fff;
            transition-property: background, color;
            transition-duration: 1s;
            transition-timing-function: var(--easeOutCirc);
        }

        .btn:active,
        .btn-active {
            background: #fff;
            color: #000;
            transition: 0s;
        }
    </style>
</head>

<body>
    <div class="title"></div>
    <div style="display: flex;flex-direction: column;align-items: center;">
        <div class="divider"></div>
        <div class="btn" onclick="openUrl('./Magnetic-Needle.html');">小磁针</div>
        <div class="btn" onclick="openUrl('./Magnetic-Needle-Emoji.html');">小磁针-emoji</div>
        <div class="btn" onclick="openUrl('./Black-Hole.html');">黑洞</div>
        <div class="btn" onclick="openUrl('./Cursor-Ball.html');">光标小球</div>
        <div class="btn" onclick="openUrl('./Balls.html');">小球网格</div>
        <div class="btn" onclick="openUrl('./Shaking-Balls.html');">抖动小球网格</div>
    </div>
    <script>
        const projectName = '小磁针';
        onload = () => {
            // 初始化页面
            setTimeout(() => {
                document.title = projectName + ' - Burger 的 Web 作品集';
                document.querySelector('.title').innerText = projectName;
                document.body.style.opacity = 1;
                document.querySelector('.divider').style.transform = 'none';
            }, 100);
            // 触摸屏优化
            const touchOptimizeItems = ['btn'];
            touchOptimizeItems.forEach((className) => {
                document.querySelectorAll('.' + className).forEach((ele) => {
                    ele.addEventListener('touchstart', () => {
                        ele.classList.add(className + '-active');
                    });
                    ele.addEventListener('touchend', () => {
                        setTimeout(() => {
                            ele.classList.remove(className + '-active');
                        }, 100);
                    });
                });
            });
        };
        // 页面跳转
        function openUrl(url) {
            setTimeout(() => {
                location.href = url;
            }, 100);
        }
    </script>
</body>

</html>
